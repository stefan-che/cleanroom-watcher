# Production Redis. The password is passed via the --requirepass flag from compose
# so it is not stored in the image.

# --- Network ---
# Listen on all interfaces inside the internal network; no port is published outside.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

# --- Keyspace notifications: REQUIRED ---
# WatchCache subscribes to "__keyevent@N__:expired": on this event the address
# is removed from the in-memory map and marked active=0 in MySQL. Without the Ex flag
# expired addresses keep being scanned until the next per-minute DB reconciliation.
# The application tries to set this itself on start (CONFIG SET), but CONFIG
# is disabled here, so the value must be set in this file.
notify-keyspace-events Ex

# --- Persistence ---
# AOF: TTLs of watched addresses must survive a restart.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
dir /data

# RDB as an extra layer.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
stop-writes-on-bgsave-error yes

# --- Memory ---
# noeviction, not volatile-lru: address keys have TTLs, and eviction
# under memory pressure would silently drop an address from watching WITHOUT an
# expired event, so the scanner would never know. Keys are tiny (address -> id);
# 256 MB is enough for hundreds of thousands of addresses.
maxmemory 256mb
maxmemory-policy noeviction

# --- Security ---
# Dangerous commands are renamed to an empty string, i.e. disabled.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# --- Logs ---
loglevel notice
logfile ""
