user  nginx;
# NOT auto: "auto" counts host cores, while compose gives the container a quota of
# NGINX_CPUS (1 by default). On a many-core server auto spawns dozens of
# workers squeezed into one core, and the master floods error.log with
# "sendmsg() failed (109: Too many references)" on every reload.
# Keep it around NGINX_CPUS: nginx only proxies here.
worker_processes  2;
worker_rlimit_nofile 20480;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logs ---
    # The request body is NOT logged: wallet addresses, webhook URLs and their
    # secrets pass through this API (POST /api/watch).
    log_format main  '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     'rt=$request_time urt=$upstream_response_time '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main buffer=64k flush=5s;

    # --- Performance ---
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    reset_timedout_connection on;
    server_tokens       off;

    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            60s;
    client_body_buffer_size 32k;
    large_client_header_buffers 4 16k;

    # --- Compression (API responses are JSON, sometimes hundreds of kilobytes) ---
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      image/svg+xml;

    # TLS is not terminated: only port 80 is exposed, https is handled by the
    # front proxy (see README). If TLS is ever needed, bring back
    # ssl_protocols/ssl_ciphers here and open 443 in the vhost template;
    # git history has a working certbot variant.
    resolver         127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # --- Rate limiting ---
    # api    - regular bot workload (address registration, transaction queries);
    # login  - admin login form, protection against password brute force;
    # sync   - heavy ?sync=true requests: each one hits the external Blockchair API.
    # Empty key -> the request is not counted against the limit. This way the "expensive"
    # limit applies only to ?sync=true requests.
    map $arg_sync $sync_key {
        default            "";
        "~*^(1|true|yes)$" $binary_remote_addr;
    }

    limit_req_zone  $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone  $sync_key           zone=sync:10m  rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;

    # --- Real client IP detection ---
    # A front proxy sits in front of the stack and opens its own connection to us,
    # so $remote_addr is the proxy address. The realip module replaces it with the
    # client address from X-Forwarded-For, but ONLY if the connection came
    # from a subnet in trusted-proxies.inc; a foreign X-Forwarded-For has no effect.
    # Rate-limit keys and the IP lists in /etc/nginx/access depend on this.
    #
    # real_ip_recursive on: nginx walks the XFF chain right to left, skipping
    # trusted addresses, and takes the first untrusted one, so forging the start
    # of the chain is useless.
    include /etc/nginx/geo/trusted-proxies.inc;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # --- Proxy ---
    proxy_buffers           16 16k;
    proxy_buffer_size       32k;
    proxy_busy_buffers_size 64k;
    proxy_http_version      1.1;

    include /etc/nginx/conf.d/*.conf;
}
