{{define "login.html"}}
{{template "head" .}}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="card w-full max-w-sm p-8">
    <div class="text-center mb-8">
      <div class="text-3xl mb-2">⬡</div>
      <h1 class="text-xl font-bold text-white">cleanroom-watcher</h1>
      <p class="text-slate-400 text-sm mt-1">Admin panel</p>
    </div>
    {{if .Error}}
    <div class="mb-4 px-4 py-3 rounded-lg bg-red-950 border border-red-800 text-red-300 text-sm">
      {{.Error}}
    </div>
    {{end}}
    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Username</label>
        <input type="text" name="username" autocomplete="username"
               class="w-full" placeholder="admin" required autofocus>
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Password</label>
        <input type="password" name="password" autocomplete="current-password"
               class="w-full" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-full justify-center mt-2">
        Sign in
      </button>
    </form>
  </div>
</div>
{{template "foot" .}}
{{end}}
