{{define "head"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listener Admin</title>
  <link rel="stylesheet" href="{{.BasePath}}/assets/tailwind.css">
  <link rel="icon" type="image/svg+xml" href="{{.BasePath}}/assets/favicon.svg">
  <style>
    body { background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:9999px; font-size:0.75rem; font-weight:600; }
    .badge-active   { background:#14532d; color:#4ade80; }
    .badge-inactive { background:#1c1917; color:#78716c; }
    .badge-expired  { background:#431407; color:#fb923c; }
    .badge-tron     { background:#312e81; color:#a5b4fc; }
    .badge-btc      { background:#451a03; color:#fcd34d; }
    .badge-bnb      { background:#3f3203; color:#fde68a; }
    .badge-eth      { background:#1e1b4b; color:#c4b5fd; }
    .badge-default  { background:#1e293b; color:#94a3b8; }
    .card   { background:#1e293b; border:1px solid #334155; border-radius:0.75rem; }
    .trow:hover { background:#243147; cursor:pointer; }
    input, select {
      background:#1e293b !important;
      border:1px solid #334155 !important;
      color:#e2e8f0 !important;
      border-radius:0.375rem;
      padding:0.375rem 0.75rem;
      height:2.25rem;
      box-sizing:border-box;
      outline:none;
      -webkit-appearance:none;
      appearance:none;
    }
    input[type="checkbox"] {
      height:1rem; width:1rem; padding:0;
      accent-color:#6366f1;
      -webkit-appearance:checkbox;
      appearance:checkbox;
    }
    input:focus, select:focus { border-color:#6366f1 !important; outline:none; }
    .btn { display:inline-flex; align-items:center; padding:0.375rem 0.875rem;
           border-radius:0.375rem; font-size:0.875rem; font-weight:500; cursor:pointer; }
    .btn:hover { opacity:0.85; }
    .btn-primary { background:#4f46e5; color:#fff; }
    .btn-ghost   { background:transparent; color:#94a3b8; border:1px solid #334155; }
    nav a { color:#94a3b8; padding:0.375rem 0.75rem; border-radius:0.375rem; font-size:0.875rem; }
    nav a:hover  { color:#e2e8f0; background:#1e293b; }
    nav a.active { color:#e2e8f0; background:#312e81; }
    .mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size:0.8125rem; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#0f172a; }
    ::-webkit-scrollbar-thumb { background:#334155; border-radius:3px; }
  </style>
</head>
<body class="min-h-screen">
{{end}}

{{define "nav"}}
<header class="border-b border-slate-700 bg-slate-900 sticky top-0 z-50">
  <div class="max-w-screen-xl mx-auto px-4 flex items-center justify-between h-14">
    <div class="flex items-center gap-6">
      <a href="{{.BasePath}}/addresses" class="text-indigo-400 font-bold text-sm tracking-wide hover:text-indigo-300">LISTENER</a>
      <nav class="flex items-center gap-1">
        <a href="{{.BasePath}}/addresses"
           class="{{if eq .ActivePage "addresses"}}active{{end}}">Addresses</a>
        <a href="{{.BasePath}}/logs"
           class="{{if eq .ActivePage "logs"}}active{{end}}">Logs</a>
      </nav>
    </div>
    <a href="{{.BasePath}}/logout" class="btn btn-ghost text-xs">Log out</a>
  </div>
</header>
{{end}}

{{define "foot"}}
</body>
</html>
{{end}}
