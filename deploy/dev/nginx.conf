# Nginx config for the cleanroom-watcher API
# Replace listener.example.com with your domain
#
# Installation:
#   cp nginx.conf /etc/nginx/sites-available/cleanroom-watcher
#   ln -s /etc/nginx/sites-available/cleanroom-watcher /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# SSL certificate (Let's Encrypt):
#   certbot --nginx -d listener.example.com

# Upstream: the Go service
upstream tron_scanner {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name listener.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + proxying
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name listener.example.com;

    # ── SSL ──────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/listener.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/listener.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;

    # ── Limits ───────────────────────────────────────────────────────
    client_max_body_size 1m;

    # ── Logs ─────────────────────────────────────────────────────────
    access_log /var/log/nginx/cleanroom-watcher.access.log;
    error_log  /var/log/nginx/cleanroom-watcher.error.log;

    # ── Health check: no auth, not exposed publicly ─────────────
    location = /health {
        # Allow only localhost/monitoring; uncomment if needed:
        # allow 127.0.0.1;
        # deny all;

        proxy_pass http://tron_scanner;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # ── API: main endpoints ──────────────────────────────────────
    location / {
        proxy_pass http://tron_scanner;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts (increase if there are long requests)
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Response buffering
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }
}
