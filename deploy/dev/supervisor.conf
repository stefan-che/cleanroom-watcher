[program:cleanroom-watcher]
command=/var/www/listener/scanner
directory=/var/www/listener
environment=CONFIG_FILE="/var/www/listener/config.json"
user=root

autostart=true
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=10

stdout_logfile=/var/log/cleanroom-watcher/out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/cleanroom-watcher/error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
